<svg xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" width="985px" height="540px" font-size="14.5px">
<style>
  .ball   { fill: #f0883e; }   /* 🏀 Orange Ball */
  .shoes  { fill: #c084fc; }   /* 👟 Purple Shoes */
  .socks  { fill: #ffffff; }   /* 🧦 White Socks */
  .player { fill: #ffffff; }   /* ⛹️ Player, Hoop, Net (White) */
  
  /* 🌈 Rainbow Colors for Jersey & Lower (Shorts) */
  .rb1 { fill: #ff5e7e; }      /* Red-Pink */
  .rb2 { fill: #ff9f43; }      /* Orange */
  .rb3 { fill: #feca57; }      /* Yellow */
  .rb4 { fill: #1dd1a1; }      /* Green */
  .rb5 { fill: #48dbfb; }      /* Cyan */
  .rb6 { fill: #54a0ff; }      /* Blue */
  .rb7 { fill: #9b59b6; }      /* Purple */
  .rb8 { fill: #e056fd; }      /* Magenta */

  .key    { fill: #ffa657; }
  .value  { fill: #a5d6ff; }
  .accent { fill: #58a6ff; font-weight: bold; }
  .comment{ fill: #8b949e; }
  text, tspan { white-space: pre; }
</style>
<rect width="985px" height="540px" fill="#0d1117" rx="14" stroke="#30363d" stroke-width="1.5"/>

